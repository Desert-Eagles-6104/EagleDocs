name: Deploy Docusaurus Docs

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      - name: Setup SSH for robot2026 deploy key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ROBOT2026_SSH_KEY }}" > ~/.ssh/robot2026_actions
          chmod 600 ~/.ssh/robot2026_actions
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'EOF'
          Host github.com
            IdentityFile ~/.ssh/robot2026_actions
            IdentitiesOnly yes
          EOF
      - name: Fetch Javadoc
        run: npm run prefetch-javadoc
        
      - name: Build
        run: npm run build

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: build/
          remote_path: ${{ secrets.VPS_PATH }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
