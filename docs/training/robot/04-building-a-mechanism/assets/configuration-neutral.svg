<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">מה קורה אחרי ביטול ההנעה?</title>
  <desc id="desc">השוואה מושגית של גלגל בשני מצבי נטרול. Coast מאפשר המשך סיבוב והאטה בחיכוך. Brake מוסיף התנגדות חשמלית לסיבוב. אין כאן גרף מדידה, ובלימה אינה נעילה מכנית.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2369aa"/></marker></defs>
  <style>text{paint-order:stroke;stroke:#f2f6fc;stroke-width:3px;stroke-linejoin:round}</style>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172d48">
    <text x="360" y="40" font-size="27" direction="rtl">אחרי ביטול ההנעה</text>
    <rect x="30" y="65" width="315" height="265" rx="18" fill="#dfeefa" stroke="#2369aa" stroke-width="2"/>
    <rect x="375" y="65" width="315" height="265" rx="18" fill="#e1f3eb" stroke="#25866c" stroke-width="2"/>
    <text x="187" y="104" font-size="27" direction="ltr">Coast</text>
    <text x="532" y="104" font-size="27" direction="ltr">Brake</text>
    <g fill="#f2f6fc" stroke="#2369aa" stroke-width="4">
      <circle cx="187" cy="182" r="42"/><path d="M187 182L213 155"/>
      <circle cx="532" cy="182" r="42"/><path d="M532 182L558 155"/>
      <path d="M135 150A61 61 0 1 0 239 150" fill="none" marker-end="url(#arrow)"/>
      <path d="M480 150A61 61 0 0 0 480 214" fill="none" marker-end="url(#arrow)"/>
    </g>
    <path d="M578 158L595 149M580 181H600M578 204L595 214" stroke="#25866c" stroke-width="4"/>
    <text x="187" y="280" font-size="21" direction="rtl">ממשיך להסתובב ומאט</text>
    <text x="187" y="310" font-size="20" direction="rtl">בגלל חיכוך ועומס</text>
    <text x="532" y="280" font-size="21" direction="rtl">התנגדות חשמלית לסיבוב</text>
    <text x="532" y="310" font-size="20" direction="rtl">עשוי להאט מהר יותר</text>
    <text x="360" y="365" font-size="21" direction="rtl">השוואה מושגית · בלימה אינה נעילה מכנית</text>
  </g>
</svg>
