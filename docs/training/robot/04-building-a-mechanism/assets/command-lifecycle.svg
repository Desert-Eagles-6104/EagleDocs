<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="title desc">
  <title id="title">מחזור חיים של פקודה</title>
  <desc id="desc">יצירה מפעילה בנאי בלבד. תזמון מאושר מפעיל initialize, ואחריו execute ובדיקת isFinished במחזורים. תשובה true מובילה ל־end(false). ביטול לאחר התחלה מוביל ל־end(true), גם לפני execute ראשון.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2369aa"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ae5911"/></marker>
  </defs>
  <style>text{paint-order:stroke;stroke:#f2f6fc;stroke-width:3px;stroke-linejoin:round}</style>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172d48">
    <text x="320" y="38" font-size="28" font-weight="700" direction="rtl">אובייקט אחד, כמה ריצות אפשריות</text>
    <rect x="40" y="66" width="560" height="78" rx="16" fill="#dfeefa" stroke="#2369aa" stroke-width="2"/>
    <text x="320" y="97" font-size="26" direction="rtl">יצירה: הבנאי רץ</text>
    <text x="320" y="129" font-size="23" direction="rtl">הפקודה עדיין אינה פועלת</text>
    <path d="M210 144V211" stroke="#2369aa" stroke-width="3" marker-end="url(#blue)"/>
    <text x="408" y="185" font-size="23" direction="rtl">בקשת תזמון שאושרה</text>
    <g fill="#dfeefa" stroke="#2369aa" stroke-width="2">
      <rect x="40" y="221" width="340" height="80" rx="16"/>
      <rect x="40" y="352" width="340" height="80" rx="16"/>
      <rect x="40" y="483" width="340" height="80" rx="16"/>
    </g>
    <g font-size="26" direction="ltr" font-weight="700">
      <text x="210" y="255">initialize()</text>
      <text x="210" y="386">execute()</text>
      <text x="210" y="517">isFinished()</text>
    </g>
    <g font-size="23" direction="rtl">
      <text x="210" y="285">פעם אחת בכל התחלה</text>
      <text x="210" y="416">עבודה קצרה במחזור</text>
      <text x="210" y="547">האם הושלם?</text>
    </g>
    <path d="M210 301V343" fill="none" stroke="#2369aa" stroke-width="3" marker-end="url(#blue)"/><path d="M210 432V474" fill="none" stroke="#2369aa" stroke-width="3" marker-end="url(#blue)"/><path d="M210 563V625" fill="none" stroke="#2369aa" stroke-width="3" marker-end="url(#blue)"/>
    <path d="M40 522H17V391H34" fill="none" stroke="#2369aa" stroke-width="3" marker-end="url(#blue)"/>
    <text x="93" y="463" font-size="23" direction="ltr">false</text>
    <text x="255" y="601" font-size="23" direction="ltr">true</text>
    <rect x="425" y="352" width="185" height="128" rx="16" fill="#fff0df" stroke="#ae5911" stroke-width="2"/>
    <g font-size="24" direction="rtl">
      <text x="517" y="387">ביטול</text>
      <text x="517" y="424">או התנגשות</text>
      <text x="517" y="460">אחרי התחלה</text>
    </g>
    <path d="M380 261H517V343" fill="none" stroke="#ae5911" stroke-width="3" marker-end="url(#orange)"/><path d="M517 480V625" fill="none" stroke="#ae5911" stroke-width="3" marker-end="url(#orange)"/>
    <rect x="40" y="635" width="340" height="58" rx="14" fill="#d7f1e8" stroke="#25866c" stroke-width="2"/>
    <rect x="425" y="635" width="185" height="58" rx="14" fill="#fff0df" stroke="#ae5911" stroke-width="2"/>
    <text x="210" y="673" font-size="27" direction="ltr">end(false)</text>
    <text x="517" y="673" font-size="27" direction="ltr">end(true)</text>
    <text x="320" y="732" font-size="23" direction="rtl">בשני מסלולי הסיום דואגים לניקוי</text>
  </g>
</svg>
