<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">למה בודקים שוב בכל מחזור?</title>
  <desc id="desc">הזמן מתקדם מימין לשמאל: כפתור משוחרר, לחיצה ושחרור. בכל מחזור קוראים קלט, מחליטים ושולחים בקשה למנוע. בדיקה בתחילת הריצה בלבד תחמיץ את השינויים.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#536a84"/></marker>
  </defs>
  <rect width="960" height="580" rx="24" fill="#f2f6fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" direction="rtl" fill="#172d48">
    <text x="480" y="49" font-size="28" font-weight="700">הקלט משתנה - לכן בודקים שוב</text>
    <rect x="240" y="72" width="480" height="46" rx="12" fill="#dfe9f6"/>
    <text x="480" y="102" font-size="19">תחילת הריצה: Main ← יצירת Robot ← אתחול</text>
    <path d="M820 147H140" stroke="#536a84" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="390" y="130" width="180" height="32" fill="#f2f6fc"/>
    <text x="480" y="152" font-size="17">הזמן מתקדם</text>
    <rect x="650" y="184" width="270" height="270" rx="18" fill="#fff" stroke="#a8bbd2" stroke-width="2"/>
    <rect x="345" y="184" width="270" height="270" rx="18" fill="#fff" stroke="#25866c" stroke-width="2"/>
    <rect x="40" y="184" width="270" height="270" rx="18" fill="#fff" stroke="#a8bbd2" stroke-width="2"/>
    <g font-size="20" font-weight="700">
      <text x="785" y="218">מחזור 1</text><text x="480" y="218">מחזור 2</text><text x="175" y="218">מחזור 3</text>
    </g>
    <g stroke-width="3">
      <circle cx="785" cy="260" r="17" fill="#e4ebf4" stroke="#71859f"/>
      <circle cx="480" cy="260" r="17" fill="#25866c" stroke="#17634e"/>
      <circle cx="175" cy="260" r="17" fill="#e4ebf4" stroke="#71859f"/>
    </g>
    <g font-size="19">
      <text x="785" y="311">קוראים: הכפתור משוחרר</text>
      <text x="480" y="311">קוראים: הכפתור לחוץ</text>
      <text x="175" y="311">קוראים: הכפתור שוחרר</text>
      <text x="785" y="354">מחליטים: להישאר בעצירה</text>
      <text x="480" y="354">מחליטים: להפעיל</text>
      <text x="175" y="354">מחליטים: לעצור</text>
    </g>
    <rect x="675" y="382" width="220" height="46" rx="10" fill="#e4ebf4"/>
    <rect x="370" y="382" width="220" height="46" rx="10" fill="#d7f1e8"/>
    <rect x="65" y="382" width="220" height="46" rx="10" fill="#e4ebf4"/>
    <g font-size="19" font-weight="700">
      <text x="785" y="412">שולחים: בקשת עצירה</text>
      <text x="480" y="412">שולחים: בקשת הפעלה</text>
      <text x="175" y="412">שולחים: בקשת עצירה</text>
    </g>
    <path d="M642 320H623M337 320H318" fill="none" stroke="#536a84" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="480" y="501" font-size="21" font-weight="700">בכל מחזור: קלט חדש ← החלטה ← בקשה מעודכנת</text>
    <text x="480" y="540" font-size="19">בדיקה חד־פעמית בתחילת הריצה הייתה מחמיצה את הלחיצה ואת השחרור.</text>
  </g>
</svg>
