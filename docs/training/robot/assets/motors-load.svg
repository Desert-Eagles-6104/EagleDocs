<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title"><title id="title">אותה בקשת פלט - עומס שונה</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2369aa"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ae5911"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#25866c"/></marker></defs><style>text{paint-order:stroke;stroke:#f2f6fc;stroke-width:3px;stroke-linejoin:round}</style><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172d48"><text x="360" y="42" font-size="27" direction="rtl">אותה בקשת פלט - עומס שונה</text><rect x="385" y="80" width="300" height="145" rx="16" fill="#dcf3e9" stroke="#25866c" stroke-width="2"/><text x="535" y="114" font-size="24" direction="rtl">עומס קל</text><text x="535" y="145" font-size="20" direction="rtl">סיבוב חופשי יחסית</text><rect x="35" y="80" width="300" height="145" rx="16" fill="#fff0d6" stroke="#ae5911" stroke-width="2"/><text x="185" y="114" font-size="24" direction="rtl">עומס גדול יותר</text><text x="185" y="145" font-size="20" direction="rtl">קשה יותר לסובב</text><text x="535" y="193" font-size="21" direction="rtl">זרם ומהירות נמדדים</text><text x="185" y="193" font-size="21" direction="rtl">דרוש יותר מומנט</text><path d="M380 150H340" fill="none" stroke="#ae5911" stroke-width="4" marker-end="url(#orange)"/><text x="360" y="278" font-size="25" direction="rtl">המהירות עשויה לרדת והזרם עשוי לעלות</text><text x="360" y="320" font-size="22" direction="rtl">מגבלות הבקר עשויות לצמצם את הפלט</text><text x="360" y="363" font-size="21" direction="rtl">דוגמה מושגית בלבד - לא עוצרים מנוע ביד</text></g></svg>