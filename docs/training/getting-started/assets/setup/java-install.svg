<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Java installation — download and setup"><title>Java installation — download and setup</title><style>text{font-family:Arial,sans-serif;fill:#e8edf5;font-size:20px}.small{font-size:16px;fill:#a7b7ca}.mono{font-family:monospace;font-size:19px}.accent{fill:#f9c94b}.dark{fill:#172238}</style><rect width="1040" height="440" rx="16" fill="#101929"/><text x="30" y="40" class="accent">ILLUSTRATION · Java installation — download and setup</text><text x="55" y="90">1. Select the download:</text><rect x="55" y="110" width="930" height="58" rx="10" fill="#243650"/><text x="76" y="147">Temurin 17     ·     Windows     ·     x64     ·     JDK     ·     MSI</text><text x="55" y="215">2. In Custom Setup:</text><rect x="55" y="236" width="930" height="132" rx="10" fill="#e8edf5"/><text x="78" y="276" class="dark">[✓] Add to PATH</text><text x="78" y="314" class="dark">[ ] Set JAVA_HOME variable</text><text x="78" y="346" class="dark" style="font-size:16px">Enable JAVA_HOME only if this JDK should be the computer default.</text><text x="55" y="407" class="small">3. Next → Install → Finish. Close and reopen VS Code.</text></svg>